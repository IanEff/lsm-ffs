version: "3"

tasks:
  default:
    desc: Format, check, then build bin/lsm-ffs
    cmds:
      - task: fmt
      - task: ci
      - task: build

  run:
    desc: Format, check, build, then serve lsm-ffs on localhost:4000
    cmds:
      - task: default
      - ./bin/lsm-ffs

  fmt:
    desc: Rewrite Go files with gofmt
    cmds:
      - gofmt -w .

  ci:
    desc: Check formatting, go.mod tidiness and vet, then test with the race detector
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "gofmt needed:"
          echo "$files"
          exit 1
        fi
      - go mod tidy -diff
      - go vet ./...
      - go test -race -shuffle=on ./...

  build:
    desc: Build bin/lsm-ffs
    cmds:
      - go build -o bin/lsm-ffs ./cmd/lsm-ffs

  set:
    desc: "Set on the running server: task set -- somekey=somevalue [k2=v2 ...]"
    cmds:
      - curl -w '\n' "localhost:4000/set?{{join "&" .CLI_ARGS_LIST}}"

  get:
    desc: "Get from the running server: task get -- somekey"
    cmds:
      - curl -w '\n' "localhost:4000/get?key={{.CLI_ARGS}}"
